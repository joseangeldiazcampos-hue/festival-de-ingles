# Render.com deployment configuration
# https://render.com/docs/yaml-spec

services:
  - type: web
    name: festival-de-ingles
    env: node
    region: oregon
    plan: free
    buildCommand: "npm install && npm run build"
    startCommand: "npm start"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_TRUST_HOST
        value: "true"
      - key: ADMIN_PASSWORD
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: NODE_ENV
        value: production
      - key: NEXTAUTH_URL
        value: "https://festival-de-ingles.onrender.com"
      - key: NEXT_PUBLIC_URL
        value: "https://festival-de-ingles.onrender.com"
